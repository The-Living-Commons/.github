<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <style>
      @font-face {
        font-family: "Poiret One";
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 400;
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3A3A"/>
      <stop offset="55%" stop-color="#0B2E2C"/>
      <stop offset="100%" stop-color="#081C1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#D9B44A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D9B44A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="#07120F"/>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- outer deco frame -->
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#C9A227" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="352" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.6"/>

  <!-- corner ziggurat accents -->
  <g stroke="#C9A227" stroke-width="2" fill="none">
    <path d="M20,58 L20,20 L58,20"/>
    <path d="M34,58 L34,34 L58,34"/>
    <path d="M1180,58 L1180,20 L1142,20"/>
    <path d="M1166,58 L1166,34 L1142,34"/>
    <path d="M20,362 L20,400 L58,400"/>
    <path d="M34,362 L34,386 L58,386"/>
    <path d="M1180,362 L1180,400 L1142,400"/>
    <path d="M1166,362 L1166,386 L1142,386"/>
  </g>

  <!-- headline: deliberately plain system type, not a logo lockup — branding isn't final yet -->
  <text x="600" y="200" text-anchor="middle"
        font-family="'Poiret One', Optima, 'Century Gothic', sans-serif"
        font-weight="400" font-size="48" letter-spacing="3"
        fill="#E7C766">The Living Commons</text>

  <!-- gold rule -->
  <g stroke="#C9A227" stroke-width="1.5">
    <line x1="470" y1="221" x2="560" y2="221"/>
    <line x1="640" y1="221" x2="730" y2="221"/>
  </g>
  <circle cx="600" cy="221" r="4" fill="#C9A227"/>

  <!-- tagline -->
  <text x="600" y="258" text-anchor="middle"
        font-family="'Big Caslon', Baskerville, 'Palatino Linotype', Palatino, Garamond, Georgia, serif"
        font-style="italic" font-size="21"
        fill="#B9CFC2">Something we're building together.</text>

  <!-- bottom label -->
  <text x="600" y="300" text-anchor="middle"
        font-family="Optima, Candara, 'Century Gothic', 'Segoe UI', -apple-system, sans-serif"
        font-size="13" letter-spacing="4" fill="#8FAF9E">STAY CLOSE</text>

  <!-- botanical fronds, bottom corners only — no centered emblem -->
  <g fill="#0E3A3A" stroke="#C9A227" stroke-width="1" opacity="0.9">
    <g transform="translate(70,400)">
      <path d="M0,0 C10,-40 35,-70 70,-86 C45,-62 30,-35 24,0 Z"/>
      <path d="M0,0 C18,-30 46,-52 82,-62 C55,-45 35,-25 26,0 Z" opacity="0.8"/>
      <path d="M0,0 C24,-18 54,-30 88,-34 C60,-24 36,-12 26,0 Z" opacity="0.6"/>
    </g>
    <g transform="translate(1130,400) scale(-1,1)">
      <path d="M0,0 C10,-40 35,-70 70,-86 C45,-62 30,-35 24,0 Z"/>
      <path d="M0,0 C18,-30 46,-52 82,-62 C55,-45 35,-25 26,0 Z" opacity="0.8"/>
      <path d="M0,0 C24,-18 54,-30 88,-34 C60,-24 36,-12 26,0 Z" opacity="0.6"/>
    </g>
  </g>
</svg>
